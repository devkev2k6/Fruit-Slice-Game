<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV_FruitNinja_V1</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        /* FIX #10: add autoplay/playsinline attrs in HTML; keep hidden */
        #video_input { display: none; }
        /* FIX #2: canvas is CSS-mirrored so it looks like a mirror — landmark
           X coords must ALSO be flipped before use (done in JS, not here) */
        canvas { width: 100vw; height: 100vh; transform: scaleX(-1); display: none; }

        /* Home Screen */
        #home-screen {
            position: absolute; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: #111; z-index: 100; color: #00ffcc;
        }
        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 10px #00ffcc; }
        .tagline { color: #aaa; margin-bottom: 30px; }
        .start-btn {
            padding: 15px 40px; font-size: 1.2rem; font-family: inherit;
            background: transparent; border: 2px solid #00ffcc; color: #00ffcc;
            cursor: pointer; transition: 0.3s; border-radius: 5px;
        }
        .start-btn:hover { background: #00ffcc; color: #111; box-shadow: 0 0 20px #00ffcc; }

        /* Game UI */
        .game-ui { position: absolute; width: 100%; height: 100%; pointer-events: none; display: none; }
        #prompt {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 1.5rem; background: rgba(0,0,0,0.7);
            padding: 10px 20px; border: 1px solid #00ffcc; border-radius: 4px;
            text-align: center;
        }
        .debug-data { position: absolute; top: 10px; left: 10px; color: #00ffcc; font-size: 12px; }

        /* Score / Lives HUD */
        #hud {
            position: absolute; top: 10px; right: 15px;
            color: #00ffcc; font-size: 1rem; text-align: right; line-height: 1.8;
        }
        #hud .score-val { font-size: 2rem; font-weight: bold; text-shadow: 0 0 8px #00ffcc; }
        #hud .lives-row { font-size: 1.4rem; letter-spacing: 4px; }

        /* Game Over overlay */
        #gameover {
            display: none;
            position: absolute; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200;
            flex-direction: column; justify-content: center; align-items: center;
            color: #ff3333;
        }
        #gameover h2 { font-size: 3rem; text-shadow: 0 0 15px #ff3333; margin-bottom: 10px; }
        #gameover .final { color: #00ffcc; font-size: 1.3rem; margin-bottom: 30px; }
        #gameover .start-btn { border-color: #ff3333; color: #ff3333; }
        #gameover .start-btn:hover { background: #ff3333; color: #111; }
    </style>
</head>
<body>

    <div id="home-screen">
        <h1>FRUIT NINJA AI</h1>
        <p class="tagline">Uses Computer Vision to track your hand.</p>
        <button class="start-btn" onclick="initGame()">ENABLE CAMERA &amp; PLAY</button>
    </div>

    <div class="game-ui" id="game-ui">
        <div id="prompt">WAVE HAND TO START</div>
        <div class="debug-data">
            STATUS: CV_LIVE<br>
            SENSOR: INDEX_FING_TIP
        </div>
        <div id="hud">
            SCORE<br>
            <span class="score-val" id="scoreDisplay">0</span><br>
            <span class="lives-row" id="livesDisplay">❤️❤️❤️</span>
        </div>
    </div>

    <!-- Game over screen (shown over canvas) -->
    <div id="gameover">
        <h2>GAME OVER</h2>
        <div class="final" id="finalScore">SCORE: 0</div>
        <button class="start-btn" onclick="restartGame()">PLAY AGAIN</button>
    </div>

    <!-- FIX #10: autoplay + playsinline needed for mobile camera -->
    <video id="video_input" autoplay playsinline muted></video>
    <canvas id="gameCanvas"></canvas>

    <script>
        const v_in      = document.getElementById('video_input');
        const canvas    = document.getElementById('gameCanvas');
        const ctx       = canvas.getContext('2d');
        const promptTxt = document.getElementById('prompt');
        const homeScreen= document.getElementById('home-screen');
        const gameUI    = document.getElementById('game-ui');
        const gameoverEl= document.getElementById('gameover');
        const scoreDisp = document.getElementById('scoreDisplay');
        const livesDisp = document.getElementById('livesDisplay');
        const finalScoreEl = document.getElementById('finalScore');

        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;

        let activeFruits = [];
        let particles    = [];
        let stroke       = [];
        let prevPos      = null;
        // FIX #9: reset smoothed cursor on resize
        let sx = canvas.width / 2, sy = canvas.height / 2;
        const grav = 0.25;

        // Game state
        let score     = 0;
        let lives     = 3;
        let gameOver  = false;

        const LIVES_ICONS = ['❤️❤️❤️', '❤️❤️🖤', '❤️🖤🖤', '🖤🖤🖤'];

        const TYPES = [
            { char: '🍎', col: '#ff3333' },
            { char: '🍊', col: '#ff9900' },
            { char: '🍋', col: '#ffff00' },
            { char: '🍉', col: '#33ff33' }
        ];

        // ---------- FIX #1: guard against zero-length segment (div-by-zero) ----------
        function getDist(p1, p2, target) {
            let dx = p2.x - p1.x, dy = p2.y - p1.y;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.hypot(p1.x - target.x, p1.y - target.y);
            let t = Math.max(0, Math.min(1,
                ((target.x - p1.x) * dx + (target.y - p1.y) * dy) / lenSq
            ));
            let nearest = { x: p1.x + t * dx, y: p1.y + t * dy };
            return Math.hypot(nearest.x - target.x, nearest.y - target.y);
        }

        // -----------------------------------------------------------------------
        class Debris {
            constructor(x, y, vx, vy, icon, col, size, half, rot) {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy;
                this.icon = icon; this.col = col; this.sz = size;
                this.half = half; this.r = rot;
                this.life = 1.0;
                this.spin = (Math.random() - 0.5) * 0.2;
            }
            step() {
                this.vy += grav; this.x += this.vx; this.y += this.vy;
                this.r += this.spin; this.life -= 0.02;
            }
            render() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.life);
                ctx.translate(this.x, this.y); ctx.rotate(this.r);
                if (this.half) {
                    ctx.font = `${this.sz}px serif`;
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(this.icon, 0, 0);
                } else {
                    ctx.fillStyle = this.col;
                    ctx.beginPath();
                    // FIX #5: correct full-circle end angle
                    ctx.arc(0, 0, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Target {
            constructor() {
                const conf = TYPES[Math.floor(Math.random() * TYPES.length)];
                this.char = conf.char; this.col = conf.col;
                this.x = Math.random() * (canvas.width - 200) + 100;
                this.y = canvas.height + 50;
                this.vx = (Math.random() - 0.5) * 7;
                this.vy = -Math.random() * 14 - 11;
                this.rad = 45; this.angle = 0; this.rs = (Math.random() - 0.5) * 0.1;
                this.missed = false;
            }
            step() { this.vy += grav; this.x += this.vx; this.y += this.vy; this.angle += this.rs; }
            render() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                ctx.font = `${this.rad * 2}px serif`;
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(this.char, 0, 0); ctx.restore();
            }
            pop(angle) {
                const pwr = 5;
                particles.push(new Debris(this.x, this.y,
                    this.vx + Math.cos(angle - 1.5) * pwr,
                    this.vy + Math.sin(angle - 1.5) * pwr,
                    this.char, this.col, this.rad, true, this.angle));
                particles.push(new Debris(this.x, this.y,
                    this.vx + Math.cos(angle + 1.5) * pwr,
                    this.vy + Math.sin(angle + 1.5) * pwr,
                    this.char, this.col, this.rad, true, this.angle));
                for (let i = 0; i < 8; i++)
                    particles.push(new Debris(this.x, this.y,
                        (Math.random()-0.5)*10, (Math.random()-0.5)*10,
                        null, this.col, 5, false, 0));
            }
        }

        // ---------- Score / Lives helpers ----------
        function addScore(pts) {
            score += pts;
            scoreDisp.textContent = score;
        }

        function loseLife() {
            lives = Math.max(0, lives - 1);
            livesDisp.textContent = LIVES_ICONS[3 - lives];
            if (lives === 0) triggerGameOver();
        }

        function triggerGameOver() {
            gameOver = true;
            finalScoreEl.textContent = 'SCORE: ' + score;
            gameoverEl.style.display = 'flex';
        }

        function restartGame() {
            score = 0; lives = 3; gameOver = false;
            activeFruits = []; particles = []; stroke = []; prevPos = null;
            scoreDisp.textContent = '0';
            livesDisp.textContent = LIVES_ICONS[0];
            gameoverEl.style.display = 'none';
        }

        // ---------- Main CV callback ----------
        function runCV(data) {
            if (gameOver) return;

            ctx.drawImage(data.image, 0, 0, canvas.width, canvas.height);

            // FIX #3 & #4: always step + render fruits regardless of hand detection
            // Process fruits first so they appear even when hand is briefly lost
            for (let i = activeFruits.length - 1; i >= 0; i--) {
                const f = activeFruits[i];
                f.step();
                f.render();
                // Remove if fallen off bottom
                if (f.y > canvas.height + 100) {
                    activeFruits.splice(i, 1);
                    loseLife();  // penalty for missed fruit
                }
            }

            // Particles always run
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].step(); particles[i].render();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            if (!data.multiHandLandmarks || data.multiHandLandmarks.length === 0) {
                promptTxt.style.display = "block";
                stroke = []; prevPos = null;
            } else {
                promptTxt.style.display = "none";
                const tip = data.multiHandLandmarks[0][8];

                // FIX #2: flip X to match CSS mirror transform on canvas
                const flippedX = 1 - tip.x;
                sx += (flippedX * canvas.width  - sx) * 0.35;
                sy += (tip.y    * canvas.height - sy) * 0.35;
                const nowPos = { x: sx, y: sy };

                stroke.unshift({ ...nowPos });
                if (stroke.length > 10) stroke.pop();

                // Slash / hit detection
                if (prevPos) {
                    for (let i = activeFruits.length - 1; i >= 0; i--) {
                        const f = activeFruits[i];
                        if (getDist(prevPos, nowPos, f) < f.rad) {
                            f.pop(Math.atan2(nowPos.y - prevPos.y, nowPos.x - prevPos.x));
                            activeFruits.splice(i, 1);
                            addScore(10);
                        }
                    }
                }
                prevPos = { ...nowPos };
            }

            // Spawn new fruits
            if (Math.random() < 0.02 && activeFruits.length < 4)
                activeFruits.push(new Target());

            // Draw slash trail
            if (stroke.length > 1) {
                ctx.save();
                ctx.beginPath(); ctx.lineWidth = 6; ctx.lineCap = "round";
                ctx.strokeStyle = "#00ffcc";
                ctx.shadowColor = "#00ffcc"; ctx.shadowBlur = 8;
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
                ctx.stroke();
                ctx.restore();
            }
        }

        // ---------- Initialisation ----------
        function initGame() {
            homeScreen.style.display = 'none';
            canvas.style.display = 'block';
            gameUI.style.display = 'block';

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            // FIX #8: add minTrackingConfidence so MediaPipe doesn't re-detect every frame
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.5
            });
            hands.onResults(runCV);

            const cam = new Camera(v_in, {
                onFrame: async () => { await hands.send({ image: v_in }); },
                width: 1280, height: 720
            });
            cam.start();
        }

        // FIX #9: reset smoothed cursor on resize
        window.addEventListener('resize', () => {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
            sx = canvas.width  / 2;
            sy = canvas.height / 2;
        });
    </script>
</body>
</html>
